<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sonae title</title>
<style>
  :root { --water:#38bdf8; --olive:#a3c35a; --margine:#c08a52; --solar:#f59e0b; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: radial-gradient(120% 90% at 70% 15%, #14304d 0%, #0b121e 55%, #050910 100%); color: #f8fafc; font-family: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif; }
  .wrap { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 120px; }
  .kanji { position: absolute; right: 90px; top: 50%; transform: translateY(-50%); font-family: "Yu Mincho", "MS Mincho", serif; font-size: 360px; font-weight: 800; color: #fff; opacity: 0; animation: kanji 2.6s ease-out .1s forwards; }
  .num { font-size: 22px; font-weight: 800; color: var(--tone); letter-spacing: .02em; opacity: 0; transform: translateY(14px); animation: up .6s cubic-bezier(.16,1,.3,1) .15s forwards; }
  .line { height: 4px; width: 0; border-radius: 4px; background: linear-gradient(90deg, var(--water), var(--tone)); margin: 18px 0 22px; animation: line .9s cubic-bezier(.16,1,.3,1) .25s forwards; box-shadow: 0 0 24px var(--tone); }
  h1 { font-size: 64px; line-height: 1.05; font-weight: 800; letter-spacing: -.02em; max-width: 900px; opacity: 0; transform: translateY(24px); filter: blur(8px); animation: rise .8s cubic-bezier(.16,1,.3,1) .35s forwards; }
  p { margin-top: 18px; font-size: 25px; line-height: 1.4; color: #b8c4d4; max-width: 820px; opacity: 0; transform: translateY(16px); animation: up .7s cubic-bezier(.16,1,.3,1) .7s forwards; }
  .actor { display: inline-flex; align-items: center; gap: 10px; margin-top: 26px; padding: 9px 18px; border-radius: 999px; border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.05); font-size: 18px; font-weight: 700; color: #e6edf5; opacity: 0; animation: up .6s cubic-bezier(.16,1,.3,1) 1s forwards; width: fit-content; }
  .actor i { width: 10px; height: 10px; border-radius: 50%; background: var(--tone); box-shadow: 0 0 12px var(--tone); }
  .ripple { position: absolute; left: 50%; top: 50%; width: 220px; height: 220px; margin: -110px 0 0 -110px; border-radius: 50%; border: 1px solid var(--water); opacity: 0; animation: ripple 2.4s ease-out forwards; }
  .brand { text-align: center; align-items: center; padding: 0; }
  .brand .big { font-family: "Yu Mincho", "MS Mincho", serif; font-size: 170px; font-weight: 800; line-height: 1; background: linear-gradient(180deg,#7dd3fc,#38bdf8 45%,#1b4d7e); -webkit-background-clip: text; background-clip: text; color: transparent; clip-path: inset(100% 0 0 0); animation: fill 1.3s cubic-bezier(.65,0,.35,1) .2s forwards; }
  .brand h1 { max-width: none; font-size: 58px; margin-top: 14px; }
  .brand p { margin-left: auto; margin-right: auto; text-align: center; }
  @keyframes up { to { opacity: 1; transform: none; } }
  @keyframes rise { to { opacity: 1; transform: none; filter: none; } }
  @keyframes line { to { width: 160px; } }
  @keyframes kanji { to { opacity: .06; } }
  @keyframes fill { to { clip-path: inset(0 0 0 0); } }
  @keyframes ripple { 0% { opacity: 0; transform: scale(.5); } 20% { opacity: .5; } 100% { opacity: 0; transform: scale(3.4); } }
</style>
</head>
<body>
<script>
  const q = new URLSearchParams(location.search);
  const tone = q.get('tone') || 'var(--water)';
  document.documentElement.style.setProperty('--tone', tone);
  const brand = q.get('brand') === '1';
  const el = (h) => { const d = document.createElement('div'); d.innerHTML = h; return d.firstElementChild; };
  if (brand) {
    document.body.append(el(`<div class="wrap brand">${[0,1,2].map(i => `<span class="ripple" style="animation-delay:${.4 + i * .35}s"></span>`).join('')}<div class="big">備え</div><h1>${q.get('title')}</h1><p>${q.get('sub') || ''}</p></div>`));
  } else {
    document.body.append(el(`<div class="wrap"><div class="kanji">${q.get('kanji') || ''}</div><div class="num">${q.get('num') || ''}</div><div class="line"></div><h1>${q.get('title')}</h1><p>${q.get('sub') || ''}</p>${q.get('actor') ? `<div class="actor"><i></i>${q.get('actor')}</div>` : ''}</div>`));
  }
</script>
</body>
</html>
