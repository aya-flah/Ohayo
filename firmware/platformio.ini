; Sonae Node: ESP32 firmware. Same code for the real board and for Wokwi.
;   pio run -e esp32dev        real board (INA219 + flow sensor pulses)
;   pio run -e wokwi           simulator build (potentiometers stand in for INA219 and flow)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.2.0
  madhephaestus/ESP32Servo@^3.0.5
  adafruit/RTClib@^2.1.4
  adafruit/Adafruit INA219@^1.2.3
  adafruit/Adafruit SSD1306@^2.5.12
  adafruit/Adafruit GFX Library@^1.11.11

[env:wokwi]
extends = env:esp32dev
build_flags = -D WOKWI=1
